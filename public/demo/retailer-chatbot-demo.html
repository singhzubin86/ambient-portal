<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambient Retailer Chatbot Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius: 14px;
      --shadow: 0 4px 28px rgba(0,0,0,0.10);
    }

    body {
      font-family: var(--font);
      background: #f0f2f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      color: #1a1a2e;
    }

    /* ── Page header ── */
    .page-header {
      width: 100%;
      max-width: 720px;
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 { font-size: 1.35rem; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; letter-spacing: -0.02em; }
    .page-header p  { font-size: 0.875rem; color: #666; }
    .ambient-badge {
      display: inline-block; margin-top: 8px;
      background: #1a1a2e; color: #fff;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 100px;
    }

    /* ── Tab bar ── */
    .tab-bar {
      width: 100%; max-width: 720px;
      display: flex;
      background: #fff;
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: var(--shadow);
      overflow: hidden;
      border-bottom: 2px solid #e8e8f0;
    }
    .tab-btn {
      flex: 1; padding: 14px 8px;
      background: transparent; border: none; cursor: pointer;
      font-family: var(--font); font-size: 0.72rem; font-weight: 700; color: #999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.01em;
    }
    .tab-btn .tab-logo-wrap {
      height: 26px; display: flex; align-items: center; justify-content: center;
    }
    .tab-btn .tab-logo-wrap img {
      max-height: 26px; max-width: 90px; object-fit: contain;
      filter: grayscale(1) opacity(0.45);
      transition: filter 0.15s;
    }
    .tab-btn .tab-logo-fallback {
      font-size: 0.78rem; font-weight: 800; color: #bbb;
      letter-spacing: -0.01em;
    }
    .tab-btn:hover .tab-logo-wrap img { filter: grayscale(0.3) opacity(0.7); }
    .tab-btn:hover { background: #fafafa; }

    /* Active tab — per brand */
    .tab-btn.active[data-brand="bestbuy"]  { color: #0046be; border-bottom-color: #0046be; background: #fff; }
    .tab-btn.active[data-brand="walmart"]  { color: #0071ce; border-bottom-color: #0071ce; background: #fff; }
    .tab-btn.active[data-brand="petco"]    { color: #e4002b; border-bottom-color: #e4002b; background: #fff; }
    .tab-btn.active[data-brand="target"]   { color: #cc0000; border-bottom-color: #cc0000; background: #fff; }
    .tab-btn.active .tab-logo-wrap img     { filter: grayscale(0) opacity(1) !important; }
    .tab-btn.active[data-brand="bestbuy"] .tab-logo-fallback  { color: #0046be; }
    .tab-btn.active[data-brand="walmart"] .tab-logo-fallback  { color: #0071ce; }
    .tab-btn.active[data-brand="petco"]   .tab-logo-fallback  { color: #e4002b; }
    .tab-btn.active[data-brand="target"]  .tab-logo-fallback  { color: #cc0000; }

    /* ── Chat surface ── */
    .chat-surface {
      width: 100%; max-width: 720px;
      background: #fff;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Chat header — brand-specific gradients */
    .chat-header {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; color: #fff;
    }
    .chat-header[data-brand="bestbuy"] { background: linear-gradient(135deg, #0046be 0%, #003399 100%); }
    .chat-header[data-brand="walmart"] { background: linear-gradient(135deg, #0071ce 0%, #004f99 100%); }
    .chat-header[data-brand="petco"]   { background: linear-gradient(135deg, #e4002b 0%, #aa0020 100%); }
    .chat-header[data-brand="target"]  { background: linear-gradient(135deg, #cc0000 0%, #990000 100%); }

    /* Brand logo in header */
    .chat-header .header-logo {
      height: 28px; display: flex; align-items: center; flex-shrink: 0;
    }
    .chat-header .header-logo img {
      height: 28px; max-width: 110px; object-fit: contain;
      filter: brightness(0) invert(1); /* white version */
    }
    .chat-header .header-logo .logo-fallback {
      font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -0.02em;
    }
    /* BestBuy special: yellow accent on "Buy" */
    .chat-header[data-brand="bestbuy"] .logo-fallback .accent { color: #FFE000; }

    /* Divider between logo area and bot name */
    .chat-header .header-divider {
      width: 1px; height: 28px;
      background: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    /* Avatar */
    .chat-header .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800; flex-shrink: 0;
      letter-spacing: -0.03em;
    }
    .chat-header[data-brand="bestbuy"] .avatar { background: #FFE000; color: #0046be; }
    .chat-header[data-brand="walmart"] .avatar { background: #FFC220; color: #0071ce; }
    .chat-header[data-brand="petco"]   .avatar { background: rgba(255,255,255,0.2); color: #fff; font-size: 1.15rem; }
    .chat-header[data-brand="target"]  .avatar { background: rgba(255,255,255,0.2); color: #fff; font-size: 1.15rem; }

    .chat-header .title { display: flex; flex-direction: column; gap: 1px; }
    .chat-header .title .name { font-size: 0.88rem; font-weight: 700; color: #fff; }
    .chat-header .title .sub  { font-size: 0.7rem; font-weight: 400; color: rgba(255,255,255,0.8); }
    .chat-header .online-indicator {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      font-size: 0.7rem; color: rgba(255,255,255,0.8); white-space: nowrap;
    }
    .chat-header .online-indicator .dot {
      width: 7px; height: 7px; background: #6fec9d; border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
      flex-shrink: 0;
    }

    /* ── Message stream ── */
    .chat-body {
      padding: 20px; display: flex; flex-direction: column; gap: 14px;
      min-height: 380px;
    }

    .msg {
      max-width: 78%; padding: 11px 15px; border-radius: 14px;
      font-size: 0.875rem; line-height: 1.55;
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user  { background: #eef0f7; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.bot   { background: #f6f6fb; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-body[data-brand="bestbuy"] .msg.bot { background: #eef3ff; }
    .chat-body[data-brand="walmart"] .msg.bot { background: #eef6ff; }
    .chat-body[data-brand="petco"]   .msg.bot { background: #fff0f2; }
    .chat-body[data-brand="target"]  .msg.bot { background: #fff0f0; }

    /* ── Product catalog card (inline in bot bubble) ── */
    .product-grid {
      align-self: flex-start;
      max-width: 100%;
      display: flex; gap: 10px; flex-wrap: wrap;
      animation: fadeUp 0.3s ease;
    }
    .product-card {
      background: #fff;
      border: 1px solid #e2e2f0;
      border-radius: 12px;
      overflow: hidden;
      width: 155px;
      box-shadow: 0 2px 8px rgba(26,26,46,0.06);
      flex-shrink: 0;
    }
    .product-card img {
      width: 100%; height: 120px; object-fit: cover;
      background: #f0f0f8; display: block;
    }
    .product-card .product-info {
      padding: 8px 10px 10px;
    }
    .product-card .product-name {
      font-size: 0.75rem; font-weight: 600; color: #1a1a2e;
      line-height: 1.3; margin-bottom: 3px;
    }
    .product-card .product-price {
      font-size: 0.8rem; font-weight: 700; color: #1a7a4a;
    }

    /* ── Sponsored ad card (chat bubble) ── */
    .ad-bubble-wrapper {
      align-self: flex-start; max-width: 90%; width: 100%;
      animation: fadeUp 0.3s ease;
    }
    .ad-bubble-label {
      font-size: 0.67rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #aaa; margin-bottom: 5px; margin-left: 2px;
    }
    .ad-card {
      border: 1px solid #e2e2f0; border-radius: 14px;
      background: #fff; overflow: hidden;
      box-shadow: 0 2px 10px rgba(26,26,46,0.07);
      display: flex; flex-direction: row; align-items: flex-start;
    }
    .ad-card .ad-img {
      width: 72px; min-width: 72px; height: 72px;
      object-fit: cover; object-position: center;
      border-radius: 10px; margin: 10px 0 10px 10px;
      display: block; background: #f0f0f8; flex-shrink: 0;
    }
    .ad-disclosure {
      font-size: 0.65rem; color: #aaa;
      letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700;
      margin-bottom: 2px;
    }
    .ad-body { padding: 10px 12px 10px 10px; flex: 1; min-width: 0; }
    .ad-headline { font-size: 0.88rem; font-weight: 700; color: #1a1a2e; margin-bottom: 3px; }
    .ad-copy { font-size: 0.78rem; color: #555; line-height: 1.45; margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ad-cta {
      display: inline-block; background: #1a1a2e; color: #fff;
      padding: 5px 12px; border-radius: 6px;
      font-size: 0.75rem; font-weight: 600; text-decoration: none;
      transition: background 0.15s; cursor: pointer; border: none;
    }
    .ad-cta:hover { background: #2d2d50; }
    .ad-empty {
      padding: 22px 16px; text-align: center; color: #bbb;
      font-size: 0.8rem; border: 2px dashed #e8e8f0; border-radius: 12px;
      max-width: 90%; align-self: flex-start;
    }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex; align-items: center; gap: 4px;
      padding: 10px 14px; background: #f6f6fb;
      border-radius: 14px; border-bottom-left-radius: 4px;
      align-self: flex-start; width: fit-content;
    }
    .typing-indicator span {
      width: 7px; height: 7px; background: #bbb; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── Controls ── */
    .controls {
      width: 100%; max-width: 720px; margin-top: 20px;
      background: #fff; border-radius: var(--radius);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .controls-title {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #888;
    }
    .controls-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
    .field label { font-size: 0.72rem; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.04em; }
    .field input {
      padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 0.85rem; color: #1a1a2e; font-family: var(--font); background: #fafafa;
    }
    .field input:focus { outline: none; border-color: #1a1a2e; background: #fff; }
    .btn-replay {
      background: #1a1a2e; color: #fff; border: none;
      padding: 10px 22px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      font-family: var(--font); transition: background 0.15s; white-space: nowrap;
    }
    .btn-replay:hover { background: #2d2d50; }
    .btn-replay:disabled { background: #aaa; cursor: not-allowed; }
    .kw-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .kw-chip {
      font-size: 0.68rem; font-weight: 600; padding: 2px 8px;
      border-radius: 100px; background: #e8e8f0; color: #555;
    }
    .status {
      font-size: 0.78rem; color: #666; padding: 10px 13px;
      background: #f8f8f8; border-radius: 8px; border: 1px solid #e8e8e8;
      white-space: pre-wrap; font-family: "SF Mono","Fira Mono",monospace; display: none;
    }
    .status.visible { display: block; }
  </style>
</head>
<body>

<div class="page-header">
  <h1>Ambient Contextual Ads — Retailer Chatbot Demo</h1>
  <p>Four retail chatbot personas. Conversations surface product recommendations, then inject a contextual Ambient sponsored ad.</p>
  <span class="ambient-badge">Ambient Ad Network</span>
</div>

<div class="tab-bar" role="tablist" aria-label="Retailer chatbots">
  <button class="tab-btn active" data-brand="bestbuy" role="tab" aria-selected="true"  id="tab-bestbuy" onclick="switchTab('bestbuy')">
    <div class="tab-logo-wrap">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Best_Buy_Logo.svg/320px-Best_Buy_Logo.svg.png"
           alt="Best Buy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="tab-logo-fallback" style="display:none">Best Buy</span>
    </div>
  </button>
  <button class="tab-btn"        data-brand="walmart" role="tab" aria-selected="false" id="tab-walmart" onclick="switchTab('walmart')">
    <div class="tab-logo-wrap">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Walmart_Spark.svg/240px-Walmart_Spark.svg.png"
           alt="Walmart" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="tab-logo-fallback" style="display:none">Walmart</span>
    </div>
  </button>
  <button class="tab-btn"        data-brand="petco"   role="tab" aria-selected="false" id="tab-petco"   onclick="switchTab('petco')">
    <div class="tab-logo-wrap">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Petco_Logo.svg/320px-Petco_Logo.svg.png"
           alt="Petco" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="tab-logo-fallback" style="display:none">Petco</span>
    </div>
  </button>
  <button class="tab-btn"        data-brand="target"  role="tab" aria-selected="false" id="tab-target"  onclick="switchTab('target')">
    <div class="tab-logo-wrap">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Target_logo.svg/240px-Target_logo.svg.png"
           alt="Target" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="tab-logo-fallback" style="display:none">Target</span>
    </div>
  </button>
</div>

<div class="chat-surface">
  <div class="chat-header" id="chatHeader" data-brand="bestbuy">
    <div class="header-logo" id="chatHeaderLogo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Best_Buy_Logo.svg/320px-Best_Buy_Logo.svg.png"
           alt="Best Buy" id="chatLogoImg"
           onerror="this.style.display='none';document.getElementById('chatLogoFallback').style.display='block'">
      <span class="logo-fallback" id="chatLogoFallback" style="display:none">Best <span class="accent">Buy</span></span>
    </div>
    <div class="header-divider"></div>
    <div class="avatar" id="chatAvatar">BB</div>
    <div class="title">
      <span class="name" id="chatName">Best Buy Assistant</span>
      <span class="sub"  id="chatSubtitle">Tech &amp; Electronics Expert</span>
    </div>
    <div class="online-indicator">
      <div class="dot"></div>Online
    </div>
  </div>
  <div class="chat-body" id="chatBody" data-brand="bestbuy"></div>
</div>

<div class="controls">
  <div class="controls-title">Ad Request Config</div>
  <div class="controls-row">
    <div class="field" style="flex:2">
      <label>API Key</label>
      <input type="text" id="apiKey" value="amb_live_8sq8NgbnxVmB7TNZKVRNgEdV8c7tc3JgN6hfw1L2UwcX" />
    </div>
    <div class="field" style="flex:1">
      <label>Active Keywords</label>
      <div class="kw-chips" id="kwChips"></div>
    </div>
    <button class="btn-replay" id="replayBtn" onclick="replayTab()">↺ Replay</button>
  </div>
  <div id="status" class="status"></div>
</div>

<script>
  /* ──────────────────────────────────────────────────────────────
     Brand configuration
     Each conversation is an array of turns. A turn can have:
       { role: 'user', text: '...' }
       { role: 'bot',  text: '...', products: [...] }  ← products rendered after the text bubble
  ─────────────────────────────────────────────────────────────── */
  const BRANDS = {
    bestbuy: {
      name: 'Best Buy Assistant',
      subtitle: 'Tech & Electronics Expert',
      avatar: 'BB',
      logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Best_Buy_Logo.svg/320px-Best_Buy_Logo.svg.png',
      logoFallbackHtml: 'Best <span class="accent">Buy</span>',
      keywords: ['electronics', 'laptop', 'TV', 'bestbuy'],
      conversation: [
        { role: 'user', text: "I'm looking for a good laptop for college — budget around $800." },
        { role: 'bot',  text: "Great choice to plan ahead! For $800 you'll want at least 16 GB RAM and an SSD. Are you leaning Windows or macOS, and will you be doing anything graphics-intensive?" },
        { role: 'user', text: "Windows. Mostly writing papers, light coding, some YouTube." },
        { role: 'bot',
          text: "Perfect — no dedicated GPU needed. Here are my top picks at your budget:",
          products: [
            { name: 'Dell XPS 15 (i5, 16GB)',    price: '$799', img: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=310&h=200&fit=crop&auto=format' },
            { name: 'Lenovo IdeaPad Slim 5i',     price: '$749', img: 'https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=310&h=200&fit=crop&auto=format' },
            { name: 'ASUS VivoBook 15 OLED',      price: '$769', img: 'https://images.unsplash.com/photo-1593642632559-0c6d3fc62b89?w=310&h=200&fit=crop&auto=format' },
          ]
        },
        { role: 'user', text: "The Dell looks great. Does it come with Office?" },
        { role: 'bot',  text: "It ships with a 30-day Microsoft 365 trial. As a college student, check if your school provides Microsoft 365 Education for free — many do. Want me to also show compatible accessories like a laptop bag or USB-C hub?" },
      ]
    },
    walmart: {
      name: 'Walmart Helper',
      subtitle: 'Everyday Savings & Deals',
      avatar: 'W',
      logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Walmart_Spark.svg/240px-Walmart_Spark.svg.png',
      logoFallbackHtml: 'Walmart',
      keywords: ['walmart', 'savings', 'budget'],
      conversation: [
        { role: 'user', text: "I'm doing a big household restocking run. What are the best deals this week?" },
        { role: 'bot',  text: "Great timing! We've got strong Rollbacks on laundry, kitchen essentials, and bath. What's your priority — cleaning supplies, pantry staples, or both?" },
        { role: 'user', text: "Both. I've got about $150 to spend." },
        { role: 'bot',
          text: "At $150, swapping to Great Value on a few items saves $12–18 without sacrificing quality. Here are the top picks on Rollback right now:",
          products: [
            { name: 'Tide Pods 3-in-1 (81 ct)',       price: '$19.97', img: 'https://images.unsplash.com/photo-1610557892470-55d9e80c0bce?w=310&h=200&fit=crop&auto=format' },
            { name: 'Mainstays 6-pc Towel Set',        price: '$12.88', img: 'https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=310&h=200&fit=crop&auto=format' },
            { name: 'Great Value Extra Virgin Olive Oil', price: '$6.47', img: 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=310&h=200&fit=crop&auto=format' },
          ]
        },
        { role: 'user', text: "I'll grab the Tide and the olive oil. Anything else?" },
        { role: 'bot',  text: "Bounty Select-A-Size 12-pack is $14.97 today, and if you hit $50+ in grocery items you qualify for free curbside pickup — looks like you're already there. I'll add it to your list!" },
      ]
    },
    petco: {
      name: 'Petco Advisor',
      subtitle: 'Pet Health & Nutrition Specialist',
      avatar: '🐾',
      logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Petco_Logo.svg/320px-Petco_Logo.svg.png',
      logoFallbackHtml: 'Petco',
      keywords: ['pet', 'dog', 'cat', 'petco', 'pet food'],
      conversation: [
        { role: 'user', text: "My Golden Retriever has been really itchy. Could it be his food?" },
        { role: 'bot',  text: "Quite possibly — food sensitivities are a top cause of itchiness in dogs, especially Goldens. How old is he, and what are you currently feeding him?" },
        { role: 'user', text: "He's 3. We're on a chicken-based kibble right now." },
        { role: 'bot',
          text: "Chicken is one of the more common allergens for Goldens. I'd suggest switching to a limited-ingredient diet with a novel protein — salmon or duck are great starting points. Here are some top picks for sensitive Goldens:",
          products: [
            { name: "Blue Buffalo Life Protection Salmon", price: '$68.99', img: 'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=310&h=200&fit=crop&auto=format' },
            { name: "Taste of the Wild Pacific Stream",    price: '$54.99', img: 'https://images.unsplash.com/photo-1548681528-6a5c45b66b42?w=310&h=200&fit=crop&auto=format' },
            { name: "Hill's Sensitive Stomach & Skin",     price: '$62.49', img: 'https://images.unsplash.com/photo-1583512603805-3cc6b41f3edb?w=310&h=200&fit=crop&auto=format' },
          ]
        },
        { role: 'user', text: "What should I add to help with the itching in the meantime?" },
        { role: 'bot',  text: "Omega-3 fatty acids can reduce inflammation and soothe itchy skin in as little as 2–3 weeks. Zesty Paws Omega Bites are our top seller — dogs love them as treats. A probiotic like Purina Pro Plan FortiFlora can also help stabilize gut health during the food transition." },
      ]
    },
    target: {
      name: 'Target Finds',
      subtitle: 'Style, Home & Everyday Essentials',
      avatar: '🎯',
      logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Target_logo.svg/240px-Target_logo.svg.png',
      logoFallbackHtml: 'Target',
      keywords: ['home', 'apparel', 'target', 'style'],
      conversation: [
        { role: 'user', text: "I'm redecorating my living room on a budget — any Target recommendations?" },
        { role: 'bot',  text: "I love a good budget refresh! What's the vibe you're going for — cozy and warm, modern minimal, or something more eclectic?" },
        { role: 'user', text: "Cozy — lots of neutrals, warm tones. Maybe some plants." },
        { role: 'bot',
          text: "Perfect for the Hearth & Hand with Magnolia line. A few key pieces can transform the whole space without breaking the bank. Here are my picks:",
          products: [
            { name: 'Threshold 400-TC Sheet Set (Queen)', price: '$39.99', img: 'https://images.unsplash.com/photo-1584100936573-5f47d0ffe7cb?w=310&h=200&fit=crop&auto=format' },
            { name: 'A New Day Linen Blazer',              price: '$44.99', img: 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=310&h=200&fit=crop&auto=format' },
            { name: 'Brightroom Stackable Storage Bins',   price: '$14.99', img: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=310&h=200&fit=crop&auto=format' },
          ]
        },
        { role: 'user', text: "Do you have any good floor lamps that won't break the bank?" },
        { role: 'bot',  text: "Yes! The Project 62 Wood Tripod Floor Lamp ($74.99) fits perfectly with a warm-neutral room. If you prefer something more modern, the Brightech Sparq Arc Lamp in matte black is $89 and has incredible reviews. Both offer same-day pickup at most stores." },
      ]
    }
  };

  let currentBrand = 'bestbuy';
  let replayInProgress = false;

  /* ── Tab switching ── */
  function switchTab(brand) {
    if (brand === currentBrand && !replayInProgress) return;
    currentBrand = brand;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      const active = btn.dataset.brand === brand;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', String(active));
    });

    const cfg = BRANDS[brand];
    const header = document.getElementById('chatHeader');
    header.dataset.brand = brand;

    // Swap header logo
    const logoImg = document.getElementById('chatLogoImg');
    const logoFallback = document.getElementById('chatLogoFallback');
    logoImg.src = cfg.logoUrl;
    logoImg.alt = cfg.name;
    logoImg.style.display = '';
    logoFallback.innerHTML = cfg.logoFallbackHtml;
    logoFallback.style.display = 'none';
    // Re-attach onerror (src change resets it)
    logoImg.onerror = function() {
      this.style.display = 'none';
      logoFallback.style.display = 'block';
    };

    // Swap avatar
    document.getElementById('chatAvatar').textContent = cfg.avatar;

    document.getElementById('chatName').textContent = cfg.name;
    document.getElementById('chatSubtitle').textContent = cfg.subtitle;
    document.getElementById('chatBody').dataset.brand = brand;

    renderKwChips(brand);
    document.getElementById('status').className = 'status';
    replayConversation(brand);
  }

  function renderKwChips(brand) {
    document.getElementById('kwChips').innerHTML =
      BRANDS[brand].keywords.map(k => `<span class="kw-chip">${escHtml(k)}</span>`).join('');
  }

  /* ── Conversation playback ── */
  async function replayConversation(brand) {
    replayInProgress = true;
    document.getElementById('replayBtn').disabled = true;

    const body = document.getElementById('chatBody');
    body.innerHTML = '';

    const msgs = BRANDS[brand].conversation;
    const DELAY_USER        = 550;
    const DELAY_BOT_TYPING  = 850;
    const DELAY_AFTER_MSG   = 400;

    for (let i = 0; i < msgs.length; i++) {
      if (currentBrand !== brand) { replayInProgress = false; return; }
      const m = msgs[i];

      if (m.role === 'bot') {
        const typing = makeTypingIndicator();
        body.appendChild(typing);
        scrollBottom(body);
        await sleep(DELAY_BOT_TYPING);
        if (currentBrand !== brand) { replayInProgress = false; return; }
        body.removeChild(typing);
        addTextBubble(body, 'bot', m.text);
        // If this turn has product cards, render them after a short delay
        if (m.products && m.products.length) {
          await sleep(200);
          if (currentBrand !== brand) { replayInProgress = false; return; }
          addProductGrid(body, m.products);
        }
      } else {
        await sleep(DELAY_USER);
        if (currentBrand !== brand) { replayInProgress = false; return; }
        addTextBubble(body, 'user', m.text);
      }
      scrollBottom(body);
      await sleep(DELAY_AFTER_MSG);
    }

    // Request and inject sponsored ad
    if (currentBrand !== brand) { replayInProgress = false; return; }
    await sleep(600);
    await requestAndRenderAd(brand);

    replayInProgress = false;
    document.getElementById('replayBtn').disabled = false;
  }

  function addTextBubble(body, role, text) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    el.textContent = text;
    body.appendChild(el);
    return el;
  }

  function addProductGrid(body, products) {
    const grid = document.createElement('div');
    grid.className = 'product-grid';
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img
          src="${escAttr(p.img)}"
          alt="${escHtml(p.name)}"
          loading="lazy"
          onerror="this.style.background='#e8e8f0'"
        />
        <div class="product-info">
          <div class="product-name">${escHtml(p.name)}</div>
          <div class="product-price">${escHtml(p.price)}</div>
        </div>`;
      grid.appendChild(card);
    });
    body.appendChild(grid);
    return grid;
  }

  function makeTypingIndicator() {
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    return el;
  }

  function scrollBottom(el) {
    // Scroll the window, not just the container (page layout)
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ── Ad request + render ── */
  async function requestAndRenderAd(brand) {
    const body = document.getElementById('chatBody');
    const apiKey = document.getElementById('apiKey').value.trim();
    const cfg = BRANDS[brand];

    // Wrapper with "Sponsored" label above
    const wrapper = document.createElement('div');
    wrapper.className = 'ad-bubble-wrapper';
    const label = document.createElement('div');
    label.className = 'ad-bubble-label';
    label.textContent = 'Sponsored';
    wrapper.appendChild(label);

    const slotEl = document.createElement('div');
    wrapper.appendChild(slotEl);
    body.appendChild(wrapper);
    scrollBottom(body);

    // Loading skeleton
    slotEl.innerHTML = `
      <div style="padding:16px 14px; display:flex; align-items:center; gap:10px; color:#aaa; font-size:0.8rem;">
        <div class="typing-indicator" style="padding:6px 10px;">
          <span></span><span></span><span></span>
        </div>
        Loading sponsored content…
      </div>`;

    const payload = {
      context: { keywords: cfg.keywords, surface: 'retailer_chatbot' },
      session_token: `demo-${brand}-session`,
      request_id: `demo-${brand}-${Date.now()}`
    };

    try {
      const resp = await fetch('https://ambient-api.fly.dev/v1/ads/request', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(payload)
      });

      if (resp.status === 204) {
        slotEl.innerHTML = `<div class="ad-empty">No fill — no matching campaign for these keywords.</div>`;
        showStatus(`${brand}: 204 No Fill`);
        return;
      }
      if (!resp.ok) {
        const err = await resp.text();
        slotEl.innerHTML = `<div class="ad-empty">Error ${resp.status} — check API key.</div>`;
        showStatus(`${brand}: Error ${resp.status}: ${err}`);
        return;
      }

      const data = await resp.json();
      showStatus(`${brand}: 200 OK — impression logged\n\n${JSON.stringify(data, null, 2)}`);
      renderAdCard(slotEl, data.ad);

    } catch(e) {
      slotEl.innerHTML = `<div class="ad-empty">Network error — ${escHtml(e.message)}</div>`;
      showStatus(`${brand}: Network error: ${e.message}`);
    }

    scrollBottom(body);
  }

  function renderAdCard(container, ad) {
    const imgHtml = ad.image_url
      ? `<img class="ad-img" src="${escAttr(ad.image_url)}" alt="${escHtml(ad.headline || 'Sponsored')}" loading="lazy" />`
      : '';
    container.innerHTML = `
      <div class="ad-card">
        ${imgHtml}
        <div class="ad-body">
          <div class="ad-disclosure">${escHtml(ad.disclosure_label || 'Sponsored')}</div>
          <div class="ad-headline">${escHtml(ad.headline)}</div>
          <div class="ad-copy">${escHtml(ad.body)}</div>
          <a class="ad-cta"
             href="${escAttr(ad.cta_url || ad.click_url)}"
             target="_blank"
             rel="noopener">${escHtml(ad.cta_text || 'Learn More')}</a>
        </div>
      </div>`;
  }

  function replayTab() {
    replayConversation(currentBrand);
  }

  /* ── Utility ── */
  function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status visible';
  }

  function escHtml(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function escAttr(s) {
    const url = String(s || '');
    return (url.startsWith('http://') || url.startsWith('https://')) ? url : '#';
  }

  /* ── Init ── */
  renderKwChips('bestbuy');
  replayConversation('bestbuy');
</script>
</body>
</html>
